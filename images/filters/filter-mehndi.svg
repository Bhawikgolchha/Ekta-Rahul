<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="henna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3a14"/>
      <stop offset="100%" stop-color="#4a1f0a"/>
    </linearGradient>

    <symbol id="paisley" viewBox="-60 -60 120 120">
      <g fill="none" stroke="url(#henna)" stroke-width="3" stroke-linecap="round">
        <!-- paisley body -->
        <path d="M -40 30 C -50 -30, 30 -55, 45 -10 C 55 25, 5 55, -40 30 Z" fill="url(#henna)" fill-opacity="0.18"/>
        <path d="M -40 30 C -50 -30, 30 -55, 45 -10 C 55 25, 5 55, -40 30 Z"/>
        <!-- inner curls -->
        <path d="M -20 20 C -25 -10, 10 -25, 20 -5"/>
        <path d="M 0 12 C 0 0, 12 -10, 20 -5"/>
        <!-- dots -->
        <circle cx="-30" cy="0" r="2.5" fill="url(#henna)"/>
        <circle cx="-12" cy="-20" r="2" fill="url(#henna)"/>
        <circle cx="10" cy="-30" r="2" fill="url(#henna)"/>
        <circle cx="35" cy="-22" r="2" fill="url(#henna)"/>
        <circle cx="40" cy="0" r="2.5" fill="url(#henna)"/>
      </g>
    </symbol>

    <symbol id="dots" viewBox="-30 -30 60 60">
      <g fill="url(#henna)">
        <circle cx="0" cy="-22" r="3"/>
        <circle cx="22" cy="0" r="3"/>
        <circle cx="0" cy="22" r="3"/>
        <circle cx="-22" cy="0" r="3"/>
        <circle cx="0" cy="0" r="4"/>
      </g>
    </symbol>

    <symbol id="vine" viewBox="0 0 240 60">
      <g fill="none" stroke="url(#henna)" stroke-width="3" stroke-linecap="round">
        <path d="M0 30 C 30 0, 60 60, 90 30 S 150 0, 180 30 S 240 60, 240 30"/>
        <circle cx="30" cy="30" r="2.5" fill="url(#henna)"/>
        <circle cx="90" cy="30" r="2.5" fill="url(#henna)"/>
        <circle cx="150" cy="30" r="2.5" fill="url(#henna)"/>
        <circle cx="210" cy="30" r="2.5" fill="url(#henna)"/>
      </g>
    </symbol>
  </defs>

  <!-- subtle cream wash on the corners only (transparent center) -->
  <radialGradient id="wash" cx="50%" cy="50%" r="55%">
    <stop offset="55%" stop-color="rgba(253,246,227,0)"/>
    <stop offset="100%" stop-color="rgba(253,246,227,0.10)"/>
  </radialGradient>
  <rect width="1080" height="1080" fill="url(#wash)"/>

  <!-- top vines -->
  <use href="#vine" x="60"  y="40"  width="320" height="80"/>
  <use href="#vine" x="380" y="40"  width="320" height="80"/>
  <use href="#vine" x="700" y="40"  width="320" height="80"/>
  <!-- bottom vines (mirrored) -->
  <g transform="translate(0 1080) scale(1 -1)">
    <use href="#vine" x="60"  y="40"  width="320" height="80"/>
    <use href="#vine" x="380" y="40"  width="320" height="80"/>
    <use href="#vine" x="700" y="40"  width="320" height="80"/>
  </g>
  <!-- left vines (rotated) -->
  <g transform="rotate(90 540 540)">
    <use href="#vine" x="60"  y="40"  width="320" height="80"/>
    <use href="#vine" x="380" y="40"  width="320" height="80"/>
    <use href="#vine" x="700" y="40"  width="320" height="80"/>
  </g>
  <!-- right vines (rotated, mirrored) -->
  <g transform="rotate(-90 540 540)">
    <use href="#vine" x="60"  y="40"  width="320" height="80"/>
    <use href="#vine" x="380" y="40"  width="320" height="80"/>
    <use href="#vine" x="700" y="40"  width="320" height="80"/>
  </g>

  <!-- four corner paisleys -->
  <use href="#paisley" x="80"  y="80"  width="160" height="160"/>
  <use href="#paisley" x="840" y="80"  width="160" height="160" transform="translate(1080 0) scale(-1 1)"/>
  <use href="#paisley" x="80"  y="840" width="160" height="160" transform="translate(0 1080) scale(1 -1)"/>
  <use href="#paisley" x="840" y="840" width="160" height="160" transform="translate(1080 1080) scale(-1 -1)"/>

  <!-- midpoint dot mandalas -->
  <use href="#dots" x="510" y="60"  width="60" height="60"/>
  <use href="#dots" x="510" y="960" width="60" height="60"/>
  <use href="#dots" x="60"  y="510" width="60" height="60"/>
  <use href="#dots" x="960" y="510" width="60" height="60"/>
</svg>
