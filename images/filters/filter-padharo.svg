<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="archfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3d1545"/>
      <stop offset="60%"  stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="rgba(26,10,46,0)"/>
    </linearGradient>
    <linearGradient id="goldedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#8a7020"/>
      <stop offset="50%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#8a7020"/>
    </linearGradient>
  </defs>

  <!-- top archway silhouette: scalloped jharokha -->
  <g>
    <!-- main filled arch -->
    <path d="M 0 0
             L 1080 0
             L 1080 280
             C 1080 280, 980 200, 920 220
             C 870 235, 850 260, 820 270
             C 800 200, 760 160, 700 160
             C 640 160, 600 200, 580 270
             C 580 200, 560 160, 540 160
             C 520 160, 500 200, 500 270
             C 480 200, 440 160, 380 160
             C 320 160, 280 200, 260 270
             C 230 260, 210 235, 160 220
             C 100 200, 0 280, 0 280 Z"
          fill="url(#archfill)"/>

    <!-- gold scalloped trim along the bottom edge of the arch -->
    <path d="M 0 280
             C 80 260, 140 290, 200 270
             C 250 255, 280 280, 320 270
             C 360 260, 380 285, 420 275
             C 460 265, 500 290, 540 280
             C 580 290, 620 265, 660 275
             C 700 285, 720 260, 760 270
             C 800 280, 830 255, 880 270
             C 940 290, 1000 260, 1080 280"
          fill="none" stroke="url(#goldedge)" stroke-width="3" opacity="0.9"/>

    <!-- hanging lanterns / drops -->
    <g fill="#ffe066" opacity="0.85">
      <circle cx="160" cy="305" r="6"/>
      <circle cx="320" cy="295" r="5"/>
      <circle cx="540" cy="305" r="7"/>
      <circle cx="760" cy="295" r="5"/>
      <circle cx="920" cy="305" r="6"/>
    </g>
    <g stroke="#c9a84c" stroke-width="1.5" opacity="0.7">
      <line x1="160" y1="280" x2="160" y2="299"/>
      <line x1="320" y1="270" x2="320" y2="290"/>
      <line x1="540" y1="280" x2="540" y2="298"/>
      <line x1="760" y1="270" x2="760" y2="290"/>
      <line x1="920" y1="280" x2="920" y2="299"/>
    </g>
  </g>

  <!-- "Padharo Sa" cursive text within the arch -->
  <text x="540" y="160"
        text-anchor="middle"
        font-family="'Dancing Script','Brush Script MT',cursive"
        font-style="italic" font-weight="700"
        font-size="86"
        fill="url(#goldedge)">Padharo Sa</text>
  <text x="540" y="200"
        text-anchor="middle"
        font-family="'Cormorant Garamond','Playfair Display',serif"
        font-style="italic" font-weight="400"
        font-size="22" letter-spacing="8"
        fill="#f4a7b9" opacity="0.9">— WELCOME TO OUR CELEBRATION —</text>

  <!-- subtle gold dust at very top -->
  <g fill="#ffe066" opacity="0.8">
    <circle cx="80"  cy="60" r="2"/>
    <circle cx="200" cy="40" r="2.5"/>
    <circle cx="400" cy="50" r="2"/>
    <circle cx="680" cy="50" r="2"/>
    <circle cx="880" cy="40" r="2.5"/>
    <circle cx="1000" cy="60" r="2"/>
  </g>
</svg>
