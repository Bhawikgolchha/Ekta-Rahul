<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="goldfoil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#8a7020"/>
      <stop offset="40%" stop-color="#ffe066"/>
      <stop offset="55%" stop-color="#fff5c0"/>
      <stop offset="70%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#8a7020"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(26,10,46,0)"/>
      <stop offset="40%"  stop-color="rgba(26,10,46,0.55)"/>
      <stop offset="100%" stop-color="rgba(26,10,46,0.85)"/>
    </linearGradient>
  </defs>

  <!-- top sparkle line -->
  <g fill="#ffe066" opacity="0.85">
    <circle cx="200" cy="120" r="3"/>
    <circle cx="320" cy="80"  r="2"/>
    <circle cx="540" cy="60"  r="3.5"/>
    <circle cx="760" cy="80"  r="2"/>
    <circle cx="880" cy="120" r="3"/>
  </g>

  <!-- bottom translucent band -->
  <rect x="0" y="720" width="1080" height="360" fill="url(#band)"/>

  <!-- gold double rule -->
  <line x1="80" y1="780" x2="1000" y2="780" stroke="url(#goldfoil)" stroke-width="2" opacity="0.85"/>
  <line x1="120" y1="792" x2="960" y2="792" stroke="url(#goldfoil)" stroke-width="1" opacity="0.55"/>

  <!-- hashtag (cursive feel via italic + skew) -->
  <text x="540" y="900"
        text-anchor="middle"
        font-family="'Dancing Script','Brush Script MT',cursive"
        font-style="italic" font-weight="700"
        font-size="120"
        fill="url(#goldfoil)">#EkRahForever</text>

  <!-- date plate -->
  <g>
    <rect x="320" y="940" width="440" height="56" rx="28"
          fill="rgba(0,0,0,0.35)"
          stroke="url(#goldfoil)" stroke-width="1.5"/>
    <text x="540" y="976"
          text-anchor="middle"
          font-family="'Cormorant Garamond','Playfair Display',serif"
          font-style="italic" font-weight="500"
          font-size="26" letter-spacing="6"
          fill="#f0d080">1 — 3 MAY 2026 · PONNERI</text>
  </g>

  <!-- bottom sparkle line -->
  <g fill="#ffe066" opacity="0.85">
    <circle cx="160" cy="1030" r="3"/>
    <circle cx="300" cy="1010" r="2"/>
    <circle cx="780" cy="1010" r="2"/>
    <circle cx="920" cy="1030" r="3"/>
  </g>
</svg>
